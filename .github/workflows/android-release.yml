name: Android release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check release version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Tag must be $expected"; exit 1; }
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.AZS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AZS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AZS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AZS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing Android signing secrets'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/azs-release.jks"
          echo "AZS_KEYSTORE_FILE=$RUNNER_TEMP/azs-release.jks" >> "$GITHUB_ENV"
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Sync game into Android project
        run: npm run android:sync
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
      - name: Build signed release APK
        working-directory: android
        env:
          AZS_STORE_PASSWORD: ${{ secrets.AZS_STORE_PASSWORD }}
          AZS_KEY_ALIAS: ${{ secrets.AZS_KEY_ALIAS }}
          AZS_KEY_PASSWORD: ${{ secrets.AZS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          cp "$apk" "AZS-Simulator-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "AZS-Simulator-${GITHUB_REF_NAME}.apk" --title "АЗС Simulator $GITHUB_REF_NAME" --generate-notes
