name: Android release

on:
  push:
    branches: ['v0.7.4']
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "$expected" || { echo "Tag must be $expected"; exit 1; }
      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.AZS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AZS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AZS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AZS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing Android signing secrets'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/azs-release.jks"
          echo "AZS_KEYSTORE_FILE=$RUNNER_TEMP/azs-release.jks" >> "$GITHUB_ENV"
      - name: Install Android SDK platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=4
      - name: Sync game into Android project
        run: npm run android:sync
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
      - name: Build signed release APK
        working-directory: android
        env:
          AZS_STORE_PASSWORD: ${{ secrets.AZS_STORE_PASSWORD }}
          AZS_KEY_ALIAS: ${{ secrets.AZS_KEY_ALIAS }}
          AZS_KEY_PASSWORD: ${{ secrets.AZS_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot comparison dependency
        run: |
          python3 -m venv .venv-smoke
          .venv-smoke/bin/pip install Pillow==11.3.0
      - name: Android emulator acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android-emulator-smoke.sh
      - name: Save Android screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-${{ github.run_number }}
          path: artifacts/android-smoke
          if-no-files-found: ignore
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          cp "$apk" "AZS-Simulator-${GITHUB_REF_NAME}.apk"
          tar -czf "AZS-Simulator-${GITHUB_REF_NAME}-web.tar.gz" -C dist .
          gh release create "$GITHUB_REF_NAME" "AZS-Simulator-${GITHUB_REF_NAME}.apk" "AZS-Simulator-${GITHUB_REF_NAME}-web.tar.gz" --title "АЗС Simulator $GITHUB_REF_NAME" --generate-notes
